    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SAL), iterations: ITER, hash: "SHA-256" }, base,
      { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  (async function () {

    });
  })();
